# See NOTICE.md for upstream attribution and license information.
# AD5X / screenless native Klipper 12 / Z-Mod 1.7.2-5 / MESH_TEST=3.
# Minimal replacement for the stock mesh-wide _FIND_POINT search.
# Nine actual mesh nodes, one nozzle clean, arithmetic mean of nine deltas.
# Keep the stock _PROBE_POINT, _MESH_TEST, startup and offset persistence.

[gcode_macro _FIND_POINT]
gcode:
    {% set bm = printer.bed_mesh %}
    {% set ny = bm.probed_matrix|length %}
    {% set nx = bm.probed_matrix[0]|length if ny else 0 %}
    {% if printer.save_variables.variables.mesh_test|default(1)|int != 3 or printer.save_variables.variables.klipper13|default(0)|int != 0 or printer['gcode_macro _SCREEN'].screen %}
        {action_raise_error('Nine-point mesh averaging requires MESH_TEST=3 and screenless native Klipper 12.')}
    {% elif not bm.profile_name or nx < 5 or ny < 5 %}
        {action_raise_error('Nine-point mesh averaging requires a loaded mesh with at least five nodes per axis.')}
    {% else %}
        {% set dx = (bm.mesh_max[0] - bm.mesh_min[0]) / (nx - 1) %}
        {% set dy = (bm.mesh_max[1] - bm.mesh_min[1]) / (ny - 1) %}
        {% set columns = [(nx - 1) // 4, (nx - 1) // 2, 3 * (nx - 1) // 4] %}
        {% set rows = [(ny - 1) // 4, (ny - 1) // 2, 3 * (ny - 1) // 4] %}
        {% set et = printer['gcode_macro _START_PRINT'].zextruder_temp|float %}
        {% set bt = printer['gcode_macro _START_PRINT'].zbed_temp|float %}
        SET_GCODE_VARIABLE MACRO=_TEST_POINT VARIABLE=temp_z_offset VALUE=0.0
        SET_GCODE_VARIABLE MACRO=_TEST_POINT VARIABLE=average_deltas VALUE="[]"
        SET_GCODE_VARIABLE MACRO=_TEST_POINT VARIABLE=average_collecting VALUE=True
        _ORIG_CLEAR_NOZZLE EXTRUDER_TEMP={et} BED_TEMP={bt}
        {% for iy in rows %}
            {% for ix in columns %}
                SET_GCODE_VARIABLE MACRO=_PROBE_POINT VARIABLE=find VALUE=False
                _PROBE_POINT X={bm.mesh_min[0] + ix * dx} Y={bm.mesh_min[1] + iy * dy} Z={bm.probed_matrix[iy][ix]|float}
            {% endfor %}
        {% endfor %}
        _TEST_POINT FINALIZE=1
        _STOP_FAN
    {% endif %}

[gcode_macro _TEST_POINT]
variable_temp_z_offset: 0.0
variable_average_deltas: []
variable_average_collecting: False
gcode:
    {% set extruder_temp = printer['gcode_macro _START_PRINT'].zextruder_temp|float %}
    {% set bed_temp = printer['gcode_macro _START_PRINT'].zbed_temp|float %}
    {% set mesh_test = printer.save_variables.variables.mesh_test|default(1)|int %}
    {% set screen = printer['gcode_macro _SCREEN'].screen %}
    {% set finalize = params.FINALIZE|default(0)|int %}
    {% set z = params.Z|default(0)|float %}
    {% set zprobe = printer.probe.last_z_result %}
    {% set zdelta = zprobe - z %}

    {% if finalize %}
        {% if not average_collecting or average_deltas|length != 9 %}
            {action_raise_error('Nine-point mesh averaging did not complete exactly nine measurements.')}
        {% endif %}
        {% set zdelta = (average_deltas|sum) / 9.0 %}
        {action_respond_info('Nine-point mesh deltas: %s' % (average_deltas,))}
        {action_respond_info('Nine-point average mesh correction: %.5f mm' % (zdelta,))}
    {% else %}
        {action_respond_info('Probe: %.4f\tMesh: %.4f\tDelta: %.4f' % (zprobe, z, zdelta))}
    {% endif %}

    {% if zdelta|abs < 0.31 %}
        {% if average_collecting and not finalize %}
            {% if average_deltas|length >= 9 %}
                {action_raise_error('Nine-point mesh averaging received too many measurements.')}
            {% endif %}
            SET_GCODE_VARIABLE MACRO=_TEST_POINT VARIABLE=average_deltas VALUE="{average_deltas + [zdelta]}"
        {% else %}
            RESTORE_GCODE_STATE MOVE=1 NAME=_mesh_test
            {% if screen %}
                LOAD_ZOFFSET_NATIVE
            {% endif %}
            _SET_GCODE_OFFSET_FAST Z_ADJUST={zdelta} FROM=_TEST_POINT
            SET_GCODE_VARIABLE MACRO=_TEST_POINT VARIABLE=temp_z_offset VALUE={zdelta}
            SET_GCODE_VARIABLE MACRO=_TEST_POINT VARIABLE=average_collecting VALUE=False
            _WAIT_TEMP EXTRUDER_TEMP={extruder_temp} BED_TEMP={bed_temp} NAME=_TEST_POINT
        {% endif %}
    {% else %}
        SET_GCODE_VARIABLE MACRO=_TEST_POINT VARIABLE=temp_z_offset VALUE=0.0
        {action_respond_info('Possible wrong profile loaded (different plate/temperature)')}
        {% if mesh_test == 3 %}
            {action_raise_error('Mesh difference %.4f mm is outside the stock 0.310 mm limit.' % (zdelta,))}
        {% else %}
            {action_respond_info('Mesh difference %.4f mm => KAMP' % (zdelta,))}
            KAMP BED_TEMP={bed_temp} EXTRUDER_TEMP={extruder_temp}
        {% endif %}
    {% endif %}
