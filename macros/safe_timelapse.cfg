# AD5X modification, September 2026: staged timelapse parking and return.
# Derived from mainsail-crew/moonraker-timelapse (GNU GPLv3).
# Include AFTER the vendor timelapse configuration. Keep its setup/camera macros.
# Fluidd: Custom X10 Y210, delta Z2 (back-left, opposite a front-right camera).

[gcode_macro TIMELAPSE_TAKE_FRAME]
description: Take a timelapse frame with separate lift, travel and return moves
variable_enable: False
variable_takingframe: False
variable_park: {'enable': False, 'pos': 'custom', 'time': 0.1, 'custom': {'x': 10, 'y': 210, 'dz': 2}, 'coord': {'x': 10, 'y': 210, 'dz': 2}}
variable_extruder: {'fw_retract': False, 'retract': 1.0, 'extrude': 1.0}
variable_speed: {'travel': 100, 'retract': 15, 'extrude': 15}
variable_verbose: True
variable_check_time: 0.5
variable_restore: {'absolute': {'coordinates': True, 'extrude': True}, 'speed': 1500, 'e': 0, 'factor': {'speed': 1.0, 'extrude': 1.0}}
variable_macro: {'pause': 'PAUSE', 'resume': 'RESUME'}
variable_is_paused: False
gcode:
    {% set hyper = params.HYPERLAPSE|default('false')|lower == 'true' %}
    {% if enable and hyper == printer['gcode_macro HYPERLAPSE'].run %}
        {% if park.enable %}
            _SAFE_TIMELAPSE_PARK HYPERLAPSE={hyper}
        {% else %}
            _TIMELAPSE_NEW_FRAME HYPERLAPSE={hyper}
        {% endif %}
    {% elif verbose %}
        {action_respond_info('Timelapse: frame ignored (disabled or different mode)')}
    {% endif %}

[gcode_macro _SAFE_TIMELAPSE_PARK]
description: Internal checked parking; DRY_RUN=1 only reports the route
variable_min_lift: 2.0
variable_min_travel_z: 2.0
variable_z_speed: 10.0
variable_active: False
variable_return_pos: {'x': 0.0, 'y': 0.0, 'z': 0.0, 'travel_z': 0.0, 'retracted': False}
gcode:
    {% set tl = printer['gcode_macro TIMELAPSE_TAKE_FRAME'] %}
    {% set gm = printer.gcode_move %}
    {% set p = gm.gcode_position %}
    {% set base = {'x': gm.position.x-p.x, 'y': gm.position.y-p.y, 'z': gm.position.z-p.z} %}
    {% set cv = printer['gcode_macro _CLIENT_VARIABLE'] %}
    {% set xmin = [cv.min_x|float, printer.toolhead.axis_minimum.x]|max %}
    {% set ymin = [cv.min_y|float, printer.toolhead.axis_minimum.y]|max %}
    {% set xmax = [cv.max_x|float, printer.toolhead.axis_maximum.x]|min %}
    {% set ymax = [cv.max_y|float, printer.toolhead.axis_maximum.y]|min %}
    {% set x = gm.position.x if tl.park.pos == 'y_only' else tl.park.coord.x|float %}
    {% set y = gm.position.y if tl.park.pos == 'x_only' else tl.park.coord.y|float %}
    {% set lift = [tl.park.coord.dz|float, min_lift|float]|max %}
    {% set z = [p.z+lift, min_travel_z|float]|max %}
    # Reserve the absolute mesh envelope plus 1 mm below the physical Z limit.
    {% set envelope = namespace(value=0.0) %}
    {% for row in printer.bed_mesh.mesh_matrix|default([]) %}
        {% for value in row %}
            {% set envelope.value = [envelope.value, value|float|abs]|max %}
        {% endfor %}
    {% endfor %}
    {% set zmax = printer.toolhead.axis_maximum.z-base.z-envelope.value-1.0 %}
    {% set route_ok = xmin <= x <= xmax and ymin <= y <= ymax and xmin <= gm.position.x <= xmax and ymin <= gm.position.y <= ymax and z <= zmax and lift > 0 and z_speed > 0 %}
    {% set dry = params.DRY_RUN|default(0)|int == 1 %}
    {% if dry %}
        {action_respond_info('Safe timelapse: X%.3f Y%.3f; Z%.3f -> %.3f first; return XY before Z; route_ok=%s (no motion)' % (x,y,p.z,z,route_ok))}
    {% elif active or tl.is_paused or printer.pause_resume.is_paused %}
        {action_respond_info('Timelapse: frame skipped during an existing pause')}
    {% elif 'xyz' not in printer.toolhead.homed_axes or not route_ok %}
        {action_respond_info('Timelapse: frame skipped; axes unhomed, route outside bed or insufficient Z clearance')}
    {% else %}
        {% set retract = printer[printer.toolhead.extruder].can_extrude %}
        {% set saved = {'x': p.x, 'y': p.y, 'z': p.z, 'travel_z': z, 'retracted': retract} %}
        SAVE_GCODE_STATE NAME=SAFE_TIMELAPSE_STATE
        SET_GCODE_VARIABLE MACRO=_SAFE_TIMELAPSE_PARK VARIABLE=return_pos VALUE="{saved}"
        SET_GCODE_VARIABLE MACRO=_SAFE_TIMELAPSE_PARK VARIABLE=active VALUE=True
        {% if retract %}
            {% if tl.extruder.fw_retract %}
                G10
            {% else %}
                M83
                G0 E-{tl.extruder.retract} F{tl.speed.retract*60}
            {% endif %}
        {% endif %}
        SET_GCODE_VARIABLE MACRO=TIMELAPSE_TAKE_FRAME VARIABLE=is_paused VALUE=True
        {tl.macro.pause}
        G90
        G0 Z{z} F{z_speed*60/gm.speed_factor}
        G0 X{x-base.x} Y{y-base.y} F{tl.speed.travel*60/gm.speed_factor}
        SET_GCODE_VARIABLE MACRO=TIMELAPSE_TAKE_FRAME VARIABLE=takingframe VALUE=True
        UPDATE_DELAYED_GCODE ID=_WAIT_TIMELAPSE_TAKE_FRAME DURATION={tl.check_time}
        M400
        _TIMELAPSE_NEW_FRAME HYPERLAPSE={params.HYPERLAPSE|default('False')}
    {% endif %}

[delayed_gcode _WAIT_TIMELAPSE_TAKE_FRAME]
gcode:
    _SAFE_TIMELAPSE_RETURN

[gcode_macro _SAFE_TIMELAPSE_RETURN]
description: Internal frame completion; return at clearance before lowering
gcode:
    {% set tl = printer['gcode_macro TIMELAPSE_TAKE_FRAME'] %}
    {% set safe = printer['gcode_macro _SAFE_TIMELAPSE_PARK'] %}
    {% if safe.active %}
        {% if not tl.is_paused or not printer.pause_resume.is_paused or 'xyz' not in printer.toolhead.homed_axes or printer.print_stats.state in ['cancelled','error','complete'] %}
            UPDATE_DELAYED_GCODE ID=_WAIT_TIMELAPSE_TAKE_FRAME DURATION=0
            SET_GCODE_VARIABLE MACRO=_SAFE_TIMELAPSE_PARK VARIABLE=active VALUE=False
            SET_GCODE_VARIABLE MACRO=TIMELAPSE_TAKE_FRAME VARIABLE=is_paused VALUE=False
            SET_GCODE_VARIABLE MACRO=TIMELAPSE_TAKE_FRAME VARIABLE=takingframe VALUE=False
            {action_respond_info('Timelapse: abandoned frame; no return or resume')}
        {% elif tl.takingframe %}
            UPDATE_DELAYED_GCODE ID=_WAIT_TIMELAPSE_TAKE_FRAME DURATION={tl.check_time}
        {% else %}
            {% set p = safe.return_pos %}
            {% set factor = printer.gcode_move.speed_factor %}
            G90
            G0 Z{p.travel_z} F{safe.z_speed*60/factor}
            G0 X{p.x} Y{p.y} F{tl.speed.travel*60/factor}
            G0 Z{p.z} F{safe.z_speed*60/factor}
            # Native RESUME now restores to the position already reached, so
            # its combined XYZ restore cannot cut diagonally through the part.
            {tl.macro.resume} VELOCITY={tl.speed.travel}
            {% if p.retracted and printer[printer.toolhead.extruder].can_extrude %}
                {% if tl.extruder.fw_retract %}
                    G11
                {% else %}
                    G90
                    M83
                    G0 E{tl.extruder.extrude} F{tl.speed.extrude*60}
                {% endif %}
            {% endif %}
            RESTORE_GCODE_STATE NAME=SAFE_TIMELAPSE_STATE
            SET_GCODE_VARIABLE MACRO=_SAFE_TIMELAPSE_PARK VARIABLE=active VALUE=False
            SET_GCODE_VARIABLE MACRO=TIMELAPSE_TAKE_FRAME VARIABLE=is_paused VALUE=False
        {% endif %}
    {% endif %}
