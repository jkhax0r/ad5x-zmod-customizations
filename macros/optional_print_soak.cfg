# Modified for jkhax0r/ad5x-zmod-customizations, September 2026.
# See NOTICE.md for upstream attribution and license information.
# Optional AD5X thermal soak - generated from this printer on 2026-09-27.
# Put this file in mod_data and include it at the end of user.cfg.
# Preserve the paired PRINT_SOAK and START_PRINT lines from orca-large-print.txt.
# Normal START_PRINT uses its existing path with no soak.

[gcode_macro _PRINT_SOAK_STATE]
variable_phase = 0
variable_skip_clean = False
variable_bypass = False
variable_job = ""
variable_deadline = 0.0
variable_ready_deadline = 0.0
variable_bed = 0.0
variable_nozzle = 0.0
variable_print_nozzle = 0.0
variable_last_minute = -1
gcode = 
	RESPOND MSG="Optional soak phase {phase}"

[gcode_macro _PRINT_SOAK_RESET]
gcode = 
	UPDATE_DELAYED_GCODE ID=_PRINT_SOAK_TIMER DURATION=0
	SET_GCODE_VARIABLE MACRO=_PRINT_SOAK_STATE VARIABLE=phase VALUE=0
	SET_GCODE_VARIABLE MACRO=_PRINT_SOAK_STATE VARIABLE=skip_clean VALUE=False
	SET_GCODE_VARIABLE MACRO=_PRINT_SOAK_STATE VARIABLE=bypass VALUE=False
	SET_GCODE_VARIABLE MACRO=_PRINT_SOAK_STATE VARIABLE=job VALUE='""'

[gcode_macro PRINT_SOAK]
description = Optional pre-mesh soak for an Orca file - followed by START_PRINT SOAK_READY=1
gcode = 
	{% set minutes = params.MINUTES|default(20)|float(-1) %}
	{% set bed = params.BED_TEMP|default(80)|float(-1) %}
	{% set nozzle = params.EXTRUDER_TEMP|default(245)|float(-1) %}
	{% if not (0 <= minutes <= 25) %}
	{action_raise_error("PRINT_SOAK MINUTES must be between 0 and 25")}
	{% endif %}
	{% if not printer.virtual_sdcard.is_active or printer.print_stats.state != 'printing' or not printer.virtual_sdcard.file_path %}
	{action_raise_error("PRINT_SOAK must be the startup line of an active printer-file job")}
	{% endif %}
	{% if not (30 <= bed < printer.configfile.settings.heater_bed.max_temp) or not (170 <= nozzle < printer.configfile.settings.extruder.max_temp) %}
	{action_raise_error("Invalid PRINT_SOAK bed or nozzle temperature")}
	{% endif %}
	{% if minutes > 0 and (printer.save_variables.variables.print_leveling|default(0)|int != 1 or printer['gcode_macro _SCREEN'].screen or printer.save_variables.variables.mesh_test|default(0)|int != 0) %}
	{action_raise_error("PRINT_SOAK requires screenless PRINT_LEVELING=1 and MESH_TEST=0")}
	{% endif %}
	{% if minutes > 0 and printer.configfile.settings.idle_timeout.timeout < minutes * 60 + 60 %}
	{action_raise_error("Configured idle timeout is too short for this soak")}
	{% endif %}
	_PRINT_SOAK_RESET
	{% if minutes == 0 %}
	SET_GCODE_VARIABLE MACRO=_PRINT_SOAK_STATE VARIABLE=phase VALUE=2
	SET_GCODE_VARIABLE MACRO=_PRINT_SOAK_STATE VARIABLE=bypass VALUE=True
	SET_GCODE_VARIABLE MACRO=_PRINT_SOAK_STATE VARIABLE=job VALUE={printer.virtual_sdcard.file_path|tojson|replace(';', '\\u003b')|tojson}
	{% else %}
	{% set force_md5 = printer.save_variables.variables.force_md5|default(1)|int %}
	{% set check_md5 = printer.save_variables.variables.check_md5|default(0)|int %}
	{% if force_md5 == 1 and check_md5 == 0 %}
	CHECK_MD5 DELETE=True
	{% endif %}
	_PREPARE_PRINT
	CLEAR_PAUSE
	ZCONTROL_AUTO
	ZCONTROL_ON
	SAVE_GCODE_STATE NAME=optional_soak_prep
	G90
	M83
	BED_MESH_CLEAR FROM=PRINT_SOAK
	_ORIG_CLEAR_NOZZLE EXTRUDER_TEMP={nozzle} BED_TEMP={bed}
	G90
	G1 Z30 F3000
	_GOTO_TRASH
	M400
	RESTORE_GCODE_STATE NAME=optional_soak_prep MOVE=0
	_PRINT_SOAK_WAIT_READY MINUTES={minutes} BED_TEMP={bed} EXTRUDER_TEMP={nozzle}
	{% endif %}

[gcode_macro _PRINT_SOAK_WAIT_READY]
gcode = 
	{% set target = printer.extruder.target|float %}
	{% set bed = params.BED_TEMP|float %}
	{% if target not in [121.0, 151.0] or (printer.heater_bed.target - bed)|abs > 0.01 %}
	{action_raise_error("Nozzle cleaning did not leave the expected probing targets")}
	{% endif %}
	TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bed - 0.5} MAXIMUM={bed + 1.0}
	TEMPERATURE_WAIT SENSOR=extruder MINIMUM={target - 1.0} MAXIMUM={target + 1.0}
	_PRINT_SOAK_BEGIN MINUTES={params.MINUTES} EXTRUDER_TEMP={params.EXTRUDER_TEMP}

[gcode_macro _PRINT_SOAK_BEGIN]
gcode = 
	{% set minutes = params.MINUTES|float %}
	SET_GCODE_VARIABLE MACRO=_PRINT_SOAK_STATE VARIABLE=phase VALUE=1
	SET_GCODE_VARIABLE MACRO=_PRINT_SOAK_STATE VARIABLE=job VALUE={printer.virtual_sdcard.file_path|tojson|replace(';', '\\u003b')|tojson}
	SET_GCODE_VARIABLE MACRO=_PRINT_SOAK_STATE VARIABLE=deadline VALUE={printer.toolhead.estimated_print_time + minutes * 60}
	SET_GCODE_VARIABLE MACRO=_PRINT_SOAK_STATE VARIABLE=bed VALUE={printer.heater_bed.target}
	SET_GCODE_VARIABLE MACRO=_PRINT_SOAK_STATE VARIABLE=nozzle VALUE={printer.extruder.target}
	SET_GCODE_VARIABLE MACRO=_PRINT_SOAK_STATE VARIABLE=print_nozzle VALUE={params.EXTRUDER_TEMP|float}
	SET_GCODE_VARIABLE MACRO=_PRINT_SOAK_STATE VARIABLE=last_minute VALUE=-1
	PAUSE_BASE
	RESPOND MSG="Soaking for {minutes} minutes before meshing. Print resumes automatically. Cancel Print remains available."
	UPDATE_DELAYED_GCODE ID=_PRINT_SOAK_TIMER DURATION=1

[delayed_gcode _PRINT_SOAK_TIMER]
gcode = 
	_PRINT_SOAK_TICK

[gcode_macro _PRINT_SOAK_TICK]
gcode = 
	{% set s = printer['gcode_macro _PRINT_SOAK_STATE'] %}
	{% if s.phase == 1 %}
	{% if printer.virtual_sdcard.file_path != s.job or printer.print_stats.state in ['cancelled', 'error', 'complete', 'standby'] %}
	_PRINT_SOAK_RESET
	{% elif not printer.pause_resume.is_paused or printer.virtual_sdcard.is_active %}
	_PRINT_SOAK_ABORT REASON="Soak pause state changed unexpectedly"
	{% elif printer.toolhead.homed_axes != 'xyz' or (printer.heater_bed.target - s.bed)|abs > 0.01 or (printer.extruder.target - s.nozzle)|abs > 0.01 %}
	_PRINT_SOAK_ABORT REASON="Heater targets or homing changed during soak"
	{% elif printer.toolhead.estimated_print_time >= s.deadline %}
	{% if (printer.heater_bed.temperature - s.bed)|abs > 2 or (printer.extruder.temperature - s.nozzle)|abs > 3 %}
	_PRINT_SOAK_ABORT REASON="Temperatures outside the soak completion range"
	{% else %}
	SET_GCODE_VARIABLE MACRO=_PRINT_SOAK_STATE VARIABLE=phase VALUE=2
	SET_GCODE_VARIABLE MACRO=_PRINT_SOAK_STATE VARIABLE=ready_deadline VALUE={printer.toolhead.estimated_print_time + 120}
	RESPOND MSG="Thermal soak complete. Continuing startup and meshing."
	M117 Soak complete
	RESUME_BASE
	{% endif %}
	{% else %}
	{% set left = ((s.deadline - printer.toolhead.estimated_print_time) / 60)|round(method='ceil')|int %}
	{% if left != s.last_minute %}
	SET_GCODE_VARIABLE MACRO=_PRINT_SOAK_STATE VARIABLE=last_minute VALUE={left}
	RESPOND MSG="Thermal soak - {left} minutes remaining"
	M117 Soak {left} min
	{% endif %}
	UPDATE_DELAYED_GCODE ID=_PRINT_SOAK_TIMER DURATION=5
	{% endif %}
	{% endif %}

[gcode_macro _PRINT_SOAK_ABORT]
gcode = 
	_PRINT_SOAK_RESET
	TURN_OFF_HEATERS
	CANCEL_PRINT
	RESPOND TYPE=error MSG="{params.REASON|default('Thermal soak stopped')}"

[gcode_macro _PRINT_SOAK_SELECT]
gcode = 
	{% set ready = params.READY|int %}
	{% set s = printer['gcode_macro _PRINT_SOAK_STATE'] %}
	{% if ready == 0 %}
	_PRINT_SOAK_RESET
	{% elif s.phase != 2 or printer.virtual_sdcard.file_path != s.job or not printer.virtual_sdcard.is_active or printer.print_stats.state != 'printing' %}
	{action_raise_error("SOAK_READY=1 requires a completed PRINT_SOAK from this file")}
	{% elif s.bypass %}
	_PRINT_SOAK_RESET
	{% else %}
	_PRINT_SOAK_VALIDATE BED_TEMP={params.BED_TEMP} EXTRUDER_TEMP={params.EXTRUDER_TEMP}
	SET_GCODE_VARIABLE MACRO=_PRINT_SOAK_STATE VARIABLE=phase VALUE=0
	SET_GCODE_VARIABLE MACRO=_PRINT_SOAK_STATE VARIABLE=skip_clean VALUE=True
	{% endif %}

[gcode_macro _PRINT_SOAK_VALIDATE]
gcode = 
	{% set s = printer['gcode_macro _PRINT_SOAK_STATE'] %}
	{% if printer.virtual_sdcard.file_path != s.job or printer.toolhead.estimated_print_time > s.ready_deadline or printer.toolhead.homed_axes != 'xyz' %}
	{action_raise_error("Completed thermal soak is stale or its homing reference changed")}
	{% endif %}
	{% if (params.BED_TEMP|float - s.bed)|abs > 0.01 or (params.EXTRUDER_TEMP|float - s.print_nozzle)|abs > 0.01 or (printer.heater_bed.target - s.bed)|abs > 0.01 or (printer.extruder.target - s.nozzle)|abs > 0.01 %}
	{action_raise_error("Print temperatures do not match the completed soak")}
	{% endif %}
	{% if (printer.heater_bed.temperature - s.bed)|abs > 2 or (printer.extruder.temperature - s.nozzle)|abs > 3 %}
	{action_raise_error("Soaked temperatures changed before meshing")}
	{% endif %}
	{% if printer.save_variables.variables.print_leveling|default(0)|int != 1 or printer['gcode_macro _SCREEN'].screen or printer.save_variables.variables.mesh_test|default(0)|int != 0 %}
	{action_raise_error("Fresh meshing settings changed after PRINT_SOAK")}
	{% endif %}

[gcode_macro _PRINT_SOAK_CLEAN]
gcode = 
	{% if printer['gcode_macro _PRINT_SOAK_STATE'].skip_clean %}
	_PRINT_SOAK_VALIDATE {rawparams}
	SET_GCODE_VARIABLE MACRO=_PRINT_SOAK_STATE VARIABLE=skip_clean VALUE=False
	RESPOND MSG="Using the nozzle cleaning completed before the thermal soak"
	{% else %}
	_ORIG_CLEAR_NOZZLE {rawparams}
	{% endif %}

[gcode_macro START_PRINT]
description = Replace default start G-code
variable_screen = False
gcode = {% if params.SOAK_MINUTES is defined %}
	    {action_raise_error("Use PRINT_SOAK MINUTES=20 on the previous Orca line and START_PRINT SOAK_READY=1")}
	{% endif %}
	{% set soak_ready = params.SOAK_READY|default(0)|int(-1) %}
	{% if soak_ready not in [0, 1] %}
	    {action_raise_error("SOAK_READY must be 0 or 1")}
	{% endif %}
	_PRINT_SOAK_SELECT READY={soak_ready} BED_TEMP={params.BED_TEMP|default(80)|float} EXTRUDER_TEMP={params.EXTRUDER_TEMP|default(245)|float}
	
	{% set extruder_temp = params.EXTRUDER_TEMP|default(245)|float %}
	{% set bed_temp = params.BED_TEMP|default(80)|float %}
	{% set force_kamp = params.FORCE_KAMP|default(False) %}
	{% set force_leveling = params.FORCE_LEVELING|default(False) %}
	{% set skip_leveling = params.SKIP_LEVELING|default(False) %}
	{% set zoffset = params.Z_OFFSET|default(99.0)|float %}
	{% set mesh = params.MESH|default("")|string %}
	{% set internal = params.INTERNAL|default(0)|int %}
	{% set external = params.EXTERNAL|default(0)|int %}
	
	{% if params.FORCE_MD5 %}
	{% set force_md5 = params.FORCE_MD5|default(True) %}
	{% if force_md5 == True %}
	{action_raise_error("Parameter FORCE_MD5 moved to SAVE_ZMOD_DATA\nUse SAVE_ZMOD_DATA FORCE_MD5=1")}
	{% else %}
	{action_raise_error("Parameter FORCE_MD5 moved to SAVE_ZMOD_DATA\nUse SAVE_ZMOD_DATA FORCE_MD5=0")}
	{% endif %}
	{% endif %}
	
	{% if params.DISABLE_PRIMING %}
	{% set disable_priming = params.DISABLE_PRIMING|default(False) %}
	{% if disable_priming == True %}
	{action_raise_error("Parameter DISABLE_PRIMING moved to SAVE_ZMOD_DATA\nUse SAVE_ZMOD_DATA DISABLE_PRIMING=1")}
	{% else %}
	{action_raise_error("Parameter DISABLE_PRIMING moved to SAVE_ZMOD_DATA\nUse SAVE_ZMOD_DATA DISABLE_PRIMING=0")}
	{% endif %}
	{% endif %}
	
	{% if params.DISABLE_SKEW_CORRECT %}
	{% set disable_skew = params.DISABLE_SKEW_CORRECT|default(True) %}
	{% if disable_skew == True %}
	{action_raise_error("Parameter DISABLE_SKEW_CORRECT moved to SAVE_ZMOD_DATA\nUse SAVE_ZMOD_DATA DISABLE_SKEW=1")}
	{% else %}
	{action_raise_error("Parameter DISABLE_SKEW_CORRECT moved to SAVE_ZMOD_DATA\nUse SAVE_ZMOD_DATA DISABLE_SKEW=0")}
	{% endif %}
	{% endif %}
	
	{% if params.CLEAR %}
	{% set clear = params.CLEAR|default("_CLEAR1")|string %}
	{action_raise_error("Parameter CLEAR moved to SAVE_ZMOD_DATA\nUse SAVE_ZMOD_DATA CLEAR=" + clear)}
	{% endif %}
	
	SET_GCODE_VARIABLE MACRO=_START_PRINT VARIABLE=zforce_kamp VALUE={force_kamp|int}
	SET_GCODE_VARIABLE MACRO=_START_PRINT VARIABLE=zbed_temp VALUE={bed_temp|float}
	SET_GCODE_VARIABLE MACRO=_START_PRINT VARIABLE=zextruder_temp VALUE={extruder_temp|float}
	SET_GCODE_VARIABLE MACRO=_START_PRINT VARIABLE=zforce_leveling VALUE={force_leveling}
	SET_GCODE_VARIABLE MACRO=_START_PRINT VARIABLE=zforce_kamp VALUE={force_kamp}
	SET_GCODE_VARIABLE MACRO=_START_PRINT VARIABLE=zskip_leveling VALUE={skip_leveling}
	SET_GCODE_VARIABLE MACRO=_START_PRINT VARIABLE=zzoffset VALUE={zoffset|float}
	SET_GCODE_VARIABLE MACRO=_START_PRINT VARIABLE=zmesh VALUE='"{mesh|string}"'
	
	_START_PRINT
	
	{% if internal == 1 %}
	AIR_CIRCULATION_INTERNAL
	{% endif %}
	{% if external == 1 %}
	AIR_CIRCULATION_EXTERNAL
	{% endif %}
	_USER_START_PRINT
	_PRINT_SOAK_RESET

[gcode_macro KAMP]
description = Adaptive bed
gcode = {% set extruder_temp = params.EXTRUDER_TEMP|default(240)|float %}
	{% set bed_temp = params.BED_TEMP|default(80)|float %}
	{% set client = printer['gcode_macro _CLIENT_VARIABLE'] | default({}) %}
	
	BED_MESH_CLEAR FROM=KAMP
	M400
	
	_PRINT_SOAK_CLEAN EXTRUDER_TEMP={extruder_temp} BED_TEMP={bed_temp}
	
	M400
	_KAMP_BED_MESH_CALIBRATE
	M400
	
	_SMART_PARK
	M400
	
	_WAIT_TEMP EXTRUDER_TEMP={extruder_temp} BED_TEMP={bed_temp} NAME=KAMP

[gcode_macro _FULL_BED_LEVEL]
description = Bed calibration without temperature off
gcode = {% set extruder_temp = params.EXTRUDER_TEMP|default(240)|float %}
	{% set bed_temp = params.BED_TEMP|default(80)|float %}
	{% set profile = params.PROFILE|default("auto") %}
	
	RESPOND PREFIX="info" MSG="Bed calibration. Profile {profile}. Extruder temp: {extruder_temp} / Bed temp: {bed_temp}"
	
	BED_MESH_CLEAR FROM=_FULL_BED_LEVEL
	M400
	
	_PRINT_SOAK_CLEAN EXTRUDER_TEMP={extruder_temp} BED_TEMP={bed_temp}
	
	
	_BED_MESH_CALIBRATE PROFILE="{profile}"
	
	_UGOL_PARK

[gcode_macro CANCEL_PRINT]
description = Cancel the actual running print
rename_existing = CANCEL_PRINT_BASE
gcode = _PRINT_SOAK_RESET
	
	
	{% set client = printer['gcode_macro _CLIENT_VARIABLE'] | default({}) %}
	{% set allow_park = client.park_at_cancel | default(false) | lower == 'true' %}
	{% set retract = client.cancel_retract | default(5.0) | abs %}
	
	{% set park_x = "" if (client.park_at_cancel_x | default(none) is none)
	else "X=" ~ client.park_at_cancel_x %}
	{% set park_y = "" if (client.park_at_cancel_y | default(none) is none)
	else "Y=" ~ client.park_at_cancel_y %}
	{% set custom_park = park_x | length > 0 or park_y | length > 0 %}
	
	
	{% if printer['gcode_macro RESUME'].restore_idle_timeout > 0 %}
	SET_IDLE_TIMEOUT TIMEOUT={printer['gcode_macro RESUME'].restore_idle_timeout}
	{% endif %}
	{% if (custom_park or not printer.pause_resume.is_paused) and allow_park %} _TOOLHEAD_PARK_PAUSE_CANCEL {park_x} {park_y} {% endif %}
	_CLIENT_RETRACT LENGTH={retract}
	TURN_OFF_HEATERS
	M106 S0
	{client.user_cancel_macro | default("")}
	SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=idle_state VALUE=False
	
	SET_PAUSE_NEXT_LAYER ENABLE=0
	SET_PAUSE_AT_LAYER ENABLE=0 LAYER=0
	CANCEL_PRINT_BASE

[gcode_macro RESUME]
description = Resume the actual running print
rename_existing = RESUME_BASE
variable_last_extruder_temp = {'restore': False, 'temp': 0, 'heater_bed_temp': 80, 'speed': 100, 'fan_speed': 0, 'x': 0, 'y': 0}
variable_restore_idle_timeout = 0
variable_idle_state = False
variable_force_restore = True
gcode = {% if printer['gcode_macro _PRINT_SOAK_STATE'].phase == 1 %}
	    RESPOND MSG="Thermal soak is running and will resume automatically. Use Cancel Print to stop it."
	{% else %}
	
	
	{% set client = printer['gcode_macro _CLIENT_VARIABLE'] | default({}) %}
	{% set velocity = printer.configfile.settings.pause_resume.recover_velocity %}
	{% set sp_move = client.speed_move | default(velocity) %}
	{% set runout_resume = True if client.runout_sensor | default("") == ""
	else True if not printer[client.runout_sensor].enabled
	else printer[client.runout_sensor].filament_detected %}
	{% set can_extrude = True if printer.toolhead.extruder == ''
	else printer[printer.toolhead.extruder].can_extrude %}
	{% set do_resume = False %}
	{% set prompt_txt = [] %}
	
	
	RESPOND TYPE=echo MSG="Resume: Restore: {last_extruder_temp.restore}, Temp: {last_extruder_temp.temp}/{last_extruder_temp.heater_bed_temp}, Status: {printer.idle_timeout.state | upper}"
	{% if printer.idle_timeout.state | upper == "IDLE" or idle_state or force_restore %}
	SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=idle_state VALUE=False
	{% if last_extruder_temp.restore %}
	
	RESPOND TYPE=echo MSG='{"Restoring \"%s\" temperature to %3.1f/%3.1f\u00B0C Fan: %3.1f" % (printer.toolhead.extruder, last_extruder_temp.temp, last_extruder_temp.heater_bed_temp, last_extruder_temp.fan_speed) }'
	
	_WAIT_TEMP EXTRUDER_TEMP={last_extruder_temp.temp} BED_TEMP={last_extruder_temp.heater_bed_temp} NAME=RESUME
	
	
	
	
	
	
	SET_FAN_SPEED FAN=fanM106 SPEED={last_extruder_temp.fan_speed}
	{% set do_resume = True %}
	{% elif can_extrude %}
	{% set do_resume = True %}
	{% else %}
	RESPOND TYPE=error MSG='{"Resumption interrupted !!! \"%s\" is not hot enough (1), please heat it up and press RESUME again" % printer.toolhead.extruder}'
	{% set _d = prompt_txt.append("\"%s\" is not hot enough, please heat it up and press RESUME again" % printer.toolhead.extruder) %}
	{% endif %}
	
	{% elif can_extrude %}
	{% set do_resume = True %}
	{% else %}
	RESPOND TYPE=error MSG='{"Resumption interrupted !!! \"%s\" is not hot enough (2), please heat it up and press RESUME again" % printer.toolhead.extruder}'
	{% set _d = prompt_txt.append("\"%s\" is not hot enough, please heat it up and press RESUME again" % printer.toolhead.extruder) %}
	{% endif %}
	{% if runout_resume %}
	{% if do_resume %}
	{% if restore_idle_timeout > 0 %} SET_IDLE_TIMEOUT TIMEOUT={restore_idle_timeout} {% endif %}
	{client.user_resume_macro | default("")}
	_CLIENT_EXTRUDE
	{% if last_extruder_temp.y > client.max_y %}
	G1 Y{client.max_y} F{params.VELOCITY | default(sp_move)}
	M400
	G1 X{last_extruder_temp.x} F{params.VELOCITY | default(sp_move)}
	M400
	{% endif %}
	RESUME_BASE VELOCITY={params.VELOCITY | default(sp_move)}
	{% endif %}
	{% else %}
	RESPOND TYPE=error MSG='{"Resumption interrupted !!! \"%s\" has detected that the filament has run out, please load it and press RESUME" % (client.runout_sensor.split(" "))[1]}'
	{% set _d = prompt_txt.append("\"%s\" has detected that the filament has run out, please load it and press RESUME" % (client.runout_sensor.split(" "))[1]) %}
	{% endif %}
	
	{% if not (runout_resume and do_resume) %}
	RESPOND TYPE=command MSG="action:prompt_beginResumption interrupted!!!"
	{% for element in prompt_txt %}
	RESPOND TYPE=command MSG='{"action:prompt_text %s" % element}'
	{% endfor %}
	RESPOND TYPE=command MSG="action:prompt_footer_button Ok|RESPOND TYPE=command MSG=action:prompt_end|info"
	RESPOND TYPE=command MSG="action:prompt_show"
	{% endif %}
	
	
	
	M400
	{% endif %}

