# Modified for jkhax0r/ad5x-zmod-customizations, September 2026.
# See NOTICE.md for upstream attribution and license information.
# AD5X / Z-Mod four-side purge placement.
# Include after the vendor macros. Configured purge_margin remains a minimum.
# Outer-band placement protects all polygons. If aggregate BORDER rectangles
# hide free edge segments, ad5x_purge checks the actual brim and low-layer paths.
# Reserve the bead envelope and the existing 10 mm wipe inside the bed.
# No valid side stops startup before changing acceleration or filament sensors.

[ad5x_purge]

[gcode_macro LINE_PURGE]
description: Purge on the clearest safe side of the complete print footprint
gcode:
    {% set dry_run = params.DRY_RUN|default(0)|int %}
    {% set client = printer['gcode_macro _CLIENT_VARIABLE'] %}
    {% set k = printer['gcode_macro _KAMP_Settings'] %}
    {% set length = k.purge_amount|float %}
    {% set height = k.purge_height|float %}
    {% set margin = k.purge_margin|float %}
    {% set flow = k.flow_rate|float %}
    {% set tip = k.tip_distance|float %}
    {% set diameter = printer.configfile.settings.extruder.filament_diameter|float %}
    {% if length <= 0 or height <= 0 or flow <= 0 or tip < 0 or margin < 0 or diameter <= 0 %}
        {action_raise_error('LINE_PURGE: invalid purge settings')}
    {% endif %}
    {% set bead_width = (3.141592653589793 * diameter * diameter / 4) / height + height * (1 - 3.141592653589793 / 4) %}
    {% set padding = [3.0, bead_width / 2 + 1.0]|max %}
    {% set clearance = [margin, padding]|max %}
    {% set wipe = 10.0 %}
    {% set bed_x0 = [client.min_x|float, printer.toolhead.axis_minimum.x|float]|max %}
    {% set bed_y0 = [client.min_y|float, printer.toolhead.axis_minimum.y|float]|max %}
    {% set bed_x1 = [client.max_x|float, printer.toolhead.axis_maximum.x|float]|min %}
    {% set bed_y1 = [client.max_y|float, printer.toolhead.axis_maximum.y|float]|min %}
    {% set points = printer.exclude_object.objects|map(attribute='polygon')|sum(start=[]) %}
    {% if points|length < 3 %}
        {action_raise_error('LINE_PURGE: no print footprint; refusing an unchecked bed purge')}
    {% endif %}
    {% set xmin = points|map(attribute=0)|min|float %}
    {% set xmax = points|map(attribute=0)|max|float %}
    {% set ymin = points|map(attribute=1)|min|float %}
    {% set ymax = points|map(attribute=1)|max|float %}
    {% set xlo = bed_x0 + padding %}
    {% set xhi = bed_x1 - padding %}
    {% set ylo = bed_y0 + padding %}
    {% set yhi = bed_y1 - padding %}
    {% set sx = [[(xmin + xmax - length) / 2, xlo]|max, xhi - length - wipe]|min %}
    {% set sy = [[(ymin + ymax - length) / 2, ylo]|max, yhi - length - wipe]|min %}
    {% set front_y = [ymin - clearance, ylo]|max %}
    {% set left_x = [xmin - clearance, xlo]|max %}
    {% set right_x = [xmax + clearance, xhi]|min %}
    {% set back_y = [ymax + clearance, yhi]|min %}
    {% set horizontal_fits = xhi - xlo >= length + wipe and yhi >= ylo %}
    {% set vertical_fits = yhi - ylo >= length + wipe and xhi >= xlo %}
    {% set candidates = [
        {'side': 'front', 'room': ymin - bed_y0, 'gap': ymin - front_y, 'fits': horizontal_fits and front_y <= yhi, 'x': sx, 'y': front_y, 'dx': 1, 'dy': 0},
        {'side': 'left', 'room': xmin - bed_x0, 'gap': xmin - left_x, 'fits': vertical_fits and left_x <= xhi, 'x': left_x, 'y': sy, 'dx': 0, 'dy': 1},
        {'side': 'right', 'room': bed_x1 - xmax, 'gap': right_x - xmax, 'fits': vertical_fits and right_x >= xlo, 'x': right_x, 'y': sy, 'dx': 0, 'dy': 1},
        {'side': 'back', 'room': bed_y1 - ymax, 'gap': back_y - ymax, 'fits': horizontal_fits and back_y >= ylo, 'x': sx, 'y': back_y, 'dx': 1, 'dy': 0}
    ] %}
    {% set best = namespace(candidate=none) %}
    {% for candidate in candidates %}
        {% if candidate.fits and candidate.gap >= clearance - 0.000001 %}
            {% if best.candidate is none or candidate.room > best.candidate.room %}
                {% set best.candidate = candidate %}
            {% endif %}
        {% endif %}
    {% endfor %}
    {% if best.candidate is none %}
        PLAN_EDGE_PURGE DRY_RUN={dry_run}
    {% else %}
        {% set p = best.candidate %}
        RESPOND MSG="Purge placement: side={p.side} room={p.room|round(3)} clearance={p.gap|round(3)} start={p.x|round(3)},{p.y|round(3)}"
        {% if not dry_run %}
            _RUN_VALIDATED_PURGE X={p.x} Y={p.y} DX={p.dx} DY={p.dy}
        {% endif %}
    {% endif %}

[gcode_macro _RUN_VALIDATED_PURGE]
description: Execute a validated outer-band or actual-toolpath placement
gcode:
    {% if printer.toolhead.homed_axes != 'xyz' or not printer.extruder.can_extrude %}
        {action_raise_error('LINE_PURGE requires homed axes and a hot nozzle')}
    {% endif %}
    {% if printer.configfile.settings.extruder.max_extrude_cross_section|float < 5 %}
        {action_raise_error('LINE_PURGE requires max_extrude_cross_section >= 5')}
    {% endif %}
    {% set accel = printer.toolhead.max_accel %}
    _TEST_MIN_MAX
    SET_VELOCITY_LIMIT ACCEL=1000
    _DISABLE_SENSOR
    _LINE_PURGE X={params.X} Y={params.Y} DX={params.DX} DY={params.DY}
    _ENABLE_SENSOR
    SET_VELOCITY_LIMIT ACCEL={accel}

[gcode_macro _LINE_PURGE]
description: Execute the placement validated by LINE_PURGE
gcode:
    {% set x = params.X|float %}
    {% set y = params.Y|float %}
    {% set dx = params.DX|int %}
    {% set dy = params.DY|int %}
    {% if (dx, dy) not in [(1, 0), (0, 1)] %}
        {action_raise_error('Call LINE_PURGE to choose and validate the purge location')}
    {% endif %}
    {% set k = printer['gcode_macro _KAMP_Settings'] %}
    {% set height = k.purge_height|float %}
    {% set amount = k.purge_amount|float %}
    {% set travel_speed = printer.toolhead.max_velocity|float * 60 %}
    {% set purge_speed = k.flow_rate|float / 5.0 * 60 %}
    {% set travel_z = [printer.gcode_move.gcode_position.z|float, k.smart_park_height|float, height * 2]|max %}
    SAVE_GCODE_STATE NAME=Prepurge_State
    EXCLUDE_OBJECT_DEFINE RESET=1
    ZEXCLUDE
    G90
    G0 Z{travel_z} F{travel_speed}
    G0 X{x} Y{y} F{travel_speed}
    G0 Z{height}
    M83
    G92 E0
    G1 E{k.tip_distance|float} F{purge_speed}
    G1 X{x + dx * amount} Y{y + dy * amount} E{amount} F{purge_speed}
    {% if printer.firmware_retraction is defined %}
        G10
    {% else %}
        G1 E-0.5 F2100
    {% endif %}
    G0 X{x + dx * (amount + 10)} Y{y + dy * (amount + 10)} F{travel_speed}
    G0 Z{travel_z} F{travel_speed}
    G92 E0
    RESTORE_GCODE_STATE NAME=Prepurge_State MOVE=0
