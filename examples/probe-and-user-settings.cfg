# EXAMPLE ONLY. Requires the compatible patched probe.py first.
# Merge selected settings into user.cfg; do not overwrite your calibrations.
[probe]
probe_retract_mode: fixed
first_probe_speed: 9
first_probe_extra_retract_dist: 0.300
speed: 0.4
lift_speed: 70
samples: 2
samples_result: average
sample_retract_dist: 0.200
samples_tolerance: 0.0125
samples_tolerance_retries: 10
probe_release_clearance: 0.000
probe_release_max_dist: 1.0
probe_release_speed: 3.0

# Independent example tuning, not required by the purge or soak macro.
#[zmod_ifs_motion_sensor ifs_motion_sensor]
#detection_length: 17

#[temperature_sensor weightValue]
#max_temp: 1550

